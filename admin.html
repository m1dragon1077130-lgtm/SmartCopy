<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل ادمین - SmartCopy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
    .container { max-width: 1000px; margin: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #1e293b; border-radius: 12px; margin-bottom: 20px; }
    .header h1 { font-size: 24px; color: #ef4444; margin: 0; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 20px; }
    .btn { padding: 10px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; }
    .status { padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .status.active { background: #22c55e; color: #fff; }
    .status.inactive { background: #ef4444; color: #fff; }
    .loading { text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>👑 پنل مدیریت SmartCopy</h1>
      <button class="btn btn-danger" onclick="logout()">خروج</button>
    </div>
    
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>👥 لیست کاربران کپی‌تریدینگ</h2>
        <button class="btn" onclick="loadUsers()">🔄 بروزرسانی لیست</button>
      </div>
      
      <div id="usersTable">
        <div class="loading">⏳ در حال بارگذاری کاربران...</div>
      </div>
    </div>
  </div>

  <script>
    async function loadUsers() {
      const tableDiv = document.getElementById('usersTable');
      tableDiv.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
      
      try {
        const resp = await fetch('/api/admin_users');
        const data = await resp.json();
        
        if (!data.ok) {
          tableDiv.innerHTML = `<div style="color: #ef4444; text-align: center;">❌ خطا: ${data.error}</div>`;
          return;
        }
        
        if (data.users.length === 0) {
          tableDiv.innerHTML = `<div style="text-align: center; color: #94a3b8;">هیچ کاربری ثبت‌نام نکرده است.</div>`;
          return;
        }
        
        let html = `
          <table>
            <thead>
              <tr>
                <th>آیدی دیتابیس</th>
                <th>User ID</th>
                <th>API Key</th>
                <th>وضعیت</th>
                <th>تاریخ ثبت</th>
              </tr>
            </thead>
            <tbody>
        `;
        
        for (const u of data.users) {
          html += `
            <tr>
              <td>${u.id ? u.id.slice(0, 8) + '...' : '---'}</td>
              <td>${u.user_id || '---'}</td>
              <td>${u.api_key ? u.api_key.slice(0, 10) + '...' : '---'}</td>
              <td><span class="status ${u.is_active ? 'active' : 'inactive'}">${u.is_active ? 'فعال' : 'غیرفعال'}</span></td>
              <td>${new Date(u.created_at).toLocaleDateString('fa')}</td>
            </tr>
          `;
        }
        
        html += `</tbody></table>`;
        tableDiv.innerHTML = html;
        
      } catch (err) {
        tableDiv.innerHTML = `<div style="color: #ef4444; text-align: center;">❌ خطا در ارتباط با سرور</div>`;
      }
    }
    
    function logout() {
      document.cookie = 'session=; Max-Age=0; Path=/';
      window.location.href = '/login.html';
    }
    
    loadUsers();
  </script>
</body>
</html>
